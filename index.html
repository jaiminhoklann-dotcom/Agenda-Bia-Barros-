</style></head><body><header><div class="top"><div><img class="brand" src="logo-bia-barros.jpeg" alt="Logo original Bia Barros"><small class="brand-sub">CENTRAL DE PRODUÇÃO DE SHOWS</small></div><div><small>Perfil de teste</small><select id="role"><option value="admin">Administrador</option><option value="prod">Produção</option><option value="tech">Técnico</option><option value="team">Equipe</option><option value="finance">Financeiro</option></select></div></div></header><main><div id="homeView"></div><div id="workspace"><div class="notice muted">Versão demonstrativa: dados salvos apenas neste navegador. A troca de perfil simula permissões, não é um login seguro nem sincroniza outros celulares.</div><nav class="tabs" id="tabs"></nav><div class="top"><h2 id="heading"></h2><button id="add" class="primary">+ Adicionar</button></div><div id="content"></div></div></main><nav class="bottom-nav" id="bottomNav"><button id="navHome"><span>⌂</span>Início</button><button id="navAgenda"><span>▦</span>Agenda</button><button class="plus" id="navPlus" aria-label="Adicionar">+</button><button id="navDocs"><span>▤</span>Arquivos</button><button id="navProfile"><span>♙</span>Perfil</button></nav><dialog id="modal"><div class="row"><h2 id="modalTitle">Novo registro</h2><button onclick="modal.close()">✕</button></div><form id="form"><div id="fields"></div><div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" onclick="modal.close()">Cancelar</button></div></form></dialog><footer>Bia Barros Produções • Protótipo local • Não inserir dados sensíveis reais</footer><script>
const sections={shows:{name:'Agenda de shows',icon:'📅',fields:[['title','Nome do show'],['date','Data','date'],['time','Horário','time'],['venue','Local'],['city','Cidade'],['status','Status','select','Pré-reserva|Confirmado|Concluído|Cancelado'],['notes','Observações','textarea']]},rider:{name:'Rider técnico',icon:'🎛️',fields:[['title','Item ou necessidade'],['category','Setor','select','Iluminação|Áudio|Palco|Backline|Outros'],['show','Show relacionado'],['notes','Especificações','textarea']]},crew:{name:'Equipe',icon:'👥',fields:[['title','Nome'],['function','Função'],['phone','Contato'],['notes','Observações','textarea']]},logistics:{name:'Logística',icon:'🚐',fields:[['title','Descrição'],['show','Show relacionado'],['date','Data','date'],['transport','Transporte'],['hotel','Hospedagem'],['notes','Detalhes','textarea']]},docs:{name:'Documentos',icon:'📁',fields:[['title','Nome do documento'],['show','Show relacionado'],['url','Link do arquivo','url'],['notes','Descrição','textarea']]},finance:{name:'Financeiro',icon:'💰',fields:[['title','Descrição'],['show','Show relacionado'],['amount','Valor (R$)','number'],['type','Tipo','select','Receita|Despesa'],['status','Situação','select','Pendente|Pago'],['notes','Observações','textarea']]}};
const keys=Object.keys(sections),ops=['view','add','edit','delete'];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function preset(sectionsAllowed,editAllowed=[]){return Object.fromEntries(keys.map(k=>[k,{view:sectionsAllowed.includes(k),add:editAllowed.includes(k),edit:editAllowed.includes(k),delete:editAllowed.includes(k)}]))}
const defaults=[{id:'admin',name:'Administrador principal',role:'Administrador',permissions:preset(keys,keys)},{id:'ju',name:'Ju',role:'Produtora',permissions:preset(keys,keys)},{id:'musico',name:'Músico (exemplo)',role:'Músico',permissions:preset(['shows'])},{id:'luz',name:'Técnico de iluminação',role:'Iluminação',permissions:preset(['shows','rider'],['rider'])},{id:'audio',name:'Técnico de áudio',role:'Áudio',permissions:preset(['shows','rider'],['rider'])},{id:'motorista',name:'Motorista',role:'Logística',permissions:preset(['shows','logistics'])}];
let db,users;try{db=JSON.parse(localStorage.getItem('bia_producao_v1'))||{}}catch{db={}}keys.forEach(k=>db[k]??=[]);try{users=JSON.parse(localStorage.getItem('bia_users_v3'))||defaults}catch{users=defaults}if(!Array.isArray(users)||!users.some(u=>u.id==='admin'))users=defaults;let current='shows',editing=null,selectedUser='admin',home=true;
function persist(){localStorage.setItem('bia_producao_v1',JSON.stringify(db));localStorage.setItem('bia_users_v3',JSON.stringify(users))}
function user(){return users.find(u=>u.id===selectedUser)||users[0]};function allowed(k,op){return selectedUser==='admin'||!!user().permissions?.[k]?.[op]};function isAdmin(){return selectedUser==='admin'}
function render(){if(home){renderHome();return;}$('homeView').hidden=true;$('workspace').hidden=false;const select=$('role');select.innerHTML=users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${esc(u.role)}</option>`).join('');select.value=selectedUser;const visible=keys.filter(k=>allowed(k,'view'));if(!visible.includes(current)&&current!=='access')current=visible[0]||'none';if(current==='access'&&!isAdmin())current=visible[0]||'none';$('tabs').innerHTML=visible.map(k=>`<button class="${current===k?'active':''}" data-tab="${k}">${sections[k].icon} ${sections[k].name}</button>`).join('')+(isAdmin()?`<button class="${current==='access'?'active':''}" data-tab="access">🔐 Gerenciar acessos</button>`:'');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});$('add').hidden=!allowed(current,'add')||current==='access';if(current==='access'){renderAccess();return}if(current==='none'){$('heading').textContent='Sem acesso';$('content').innerHTML='<div class="empty">Nenhuma área liberada para este colaborador.</div>';return} $('heading').textContent=sections[current].name;const list=db[current];$('content').innerHTML=list.length?list.map((o,i)=>`<article class="card"><div class="row"><h3>${esc(o.title||'Sem título')}</h3>${o.status?`<span class="pill">${esc(o.status)}</span>`:''}</div>${sections[current].fields.filter(f=>f[0]!=='title'&&f[0]!=='status'&&o[f[0]]).map(f=>`<p class="muted"><b>${esc(f[1])}:</b> ${f[0]==='url'&&/^https?:\/\//i.test(o[f[0]])?`<a href="${esc(o[f[0]])}" target="_blank" rel="noopener noreferrer">Abrir documento</a>`:esc(o[f[0]])}</p>`).join('')}<div class="actions">${allowed(current,'edit')?`<button data-edit="${i}">Editar</button>`:''}${allowed(current,'delete')?`<button class="danger" data-delete="${i}">Excluir</button>`:''}</div></article>`).join(''):'<div class="empty">Nenhum registro cadastrado nesta área.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!allowed(current,'delete'))return;if(confirm('Excluir este registro?')){db[current].splice(Number(b.dataset.delete),1);persist();render()}})}
function renderHome(){
$('homeView').hidden=false;$('workspace').hidden=true;
const select=$('role');select.innerHTML=users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${esc(u.role)}</option>`).join('');select.value=selectedUser;
const tiles=[['shows','📅','Agenda de Shows','Datas e horários'],['rider','🎛️','Rider Técnico','Som, luz e palco'],['crew','👥','Equipe','Profissionais'],['logistics','🚐','Logística','Viagens e hotéis'],['docs','📁','Documentos','Arquivos e contratos'],['finance','💰','Financeiro','Cachês e despesas']];
$('homeView').innerHTML=`<div class="hero"><div class="hero-inner"><img src="logo-bia-barros.jpeg" alt="Logo original Bia Barros"><div class="subtitle">PRODUÇÕES</div><div class="welcome">CENTRAL DE PRODUÇÃO DE SHOWS</div></div></div><div class="dashboard-heading">Bem-vindo(a), ${esc(user().name)}</div><div class="dashboard-grid">${tiles.filter(t=>allowed(t[0],'view')).map(t=>`<button class="dashboard-tile" data-home-tab="${t[0]}"><span class="tile-icon">${t[1]}</span><strong>${t[2]}</strong><small>${t[3]}</small></button>`).join('')}${isAdmin()?`<button class="dashboard-tile" data-home-tab="access"><span class="tile-icon">🔐</span><strong>Gerenciar Acessos</strong><small>Permissões por pessoa</small></button>`:''}</div><p class="muted" style="margin:22px 0">Protótipo local: os acessos são simulados. Não inserir dados financeiros reais.</p>`;
document.querySelectorAll('[data-home-tab]').forEach(b=>b.onclick=()=>{home=false;current=b.dataset.homeTab;render()});
}
function renderAccess(){$('heading').textContent='Gerenciar acessos';$('content').innerHTML=`<div class="notice">Simulação local: trocar de perfil não exige senha. Para uso real, as permissões precisam ser verificadas no servidor.</div><div class="card"><h3>Colaboradores</h3><div class="user-grid">${users.map(u=>`<button data-user="${esc(u.id)}">${esc(u.name)}<br><small>${esc(u.role)}</small></button>`).join('')}</div><div class="actions"><button class="primary" id="newUser">+ Colaborador</button></div></div><div id="accessEditor"></div>`;document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>editAccess(b.dataset.user));$('newUser').onclick=()=>{const name=prompt('Nome do colaborador:');if(!name?.trim())return;const role=prompt('Função (ex.: Músico, Técnica, Produção):')||'Equipe';const id='user_'+Date.now();users.push({id,name:name.trim(),role:role.trim(),permissions:preset([])});persist();render();editAccess(id)}}
function editAccess(id){const u=users.find(x=>x.id===id);if(!u)return;const locked=u.id==='admin';$('accessEditor').innerHTML=`<div class="card"><div class="row"><div><h3>${esc(u.name)}</h3><small>${esc(u.role)}</small></div>${!locked?`<button class="danger" id="removeUser">Remover</button>`:''}</div><p class="helper">${locked?'Administrador principal: acesso completo e permanente nesta demonstração.':'Marque o que esta pessoa pode fazer em cada área.'}</p>${keys.map(k=>`<div class="perm-row"><strong>${sections[k].icon} ${sections[k].name}</strong><div class="perm-grid">${ops.map((op,i)=>`<label><input type="checkbox" data-section="${k}" data-op="${op}" ${locked||u.permissions?.[k]?.[op]?'checked':''} ${locked?'disabled':''}>${['Ver','Adicionar','Editar','Excluir'][i]}</label>`).join('')}</div></div>`).join('')}${locked?'':`<button class="primary" id="savePerm">Salvar permissões</button>`}</div>`;if(!locked){$('savePerm').onclick=()=>{const updated=preset([]);document.querySelectorAll('#accessEditor input[type=checkbox]').forEach(c=>updated[c.dataset.section][c.dataset.op]=c.checked);for(const k of keys)if(!updated[k].view){updated[k].add=false;updated[k].edit=false;updated[k].delete=false}u.permissions=updated;persist();alert('Permissões salvas neste navegador.');render();editAccess(id)};$('removeUser').onclick=()=>{if(confirm('Remover colaborador?')){users=users.filter(x=>x.id!==id);persist();render()}}}}
function openForm(index=null){if(!allowed(current,index===null?'add':'edit'))return;editing=index;const data=index===null?{}:db[current][index];$('modalTitle').textContent=(index===null?'Adicionar':'Editar')+' • '+sections[current].name;$('fields').innerHTML=sections[current].fields.map(([key,label,type='text',opts])=>`<label for="field_${key}">${label}</label>${type==='textarea'?`<textarea id="field_${key}" name="${key}">${esc(data[key])}</textarea>`:type==='select'?`<select id="field_${key}" name="${key}">${opts.split('|').map(v=>`<option ${data[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input id="field_${key}" name="${key}" type="${type}" value="${esc(data[key])}" ${key==='title'?'required':''} ${type==='number'?'step="0.01"':''}>`}`).join('');$('modal').showModal()}
$('add').onclick=()=>openForm();$('role').onchange=e=>{selectedUser=e.target.value;current='shows';home=true;render()};$('navHome').onclick=()=>{home=true;render()};$('navAgenda').onclick=()=>{home=false;current='shows';render()};$('navDocs').onclick=()=>{home=false;current='docs';render()};$('navProfile').onclick=()=>{home=isAdmin()?false:true;current='access';render()};$('navPlus').onclick=()=>{home=false;current=allowed('shows','add')?'shows':keys.find(k=>allowed(k,'add'))||'shows';render();if(allowed(current,'add'))openForm()};$('form').onsubmit=e=>{e.preventDefault();if(!allowed(current,editing===null?'add':'edit'))return;const data=Object.fromEntries(new FormData(e.target).entries());if(editing===null)db[current].push(data);else db[current][editing]=data;persist();$('modal').close();render()};render();
</script><script id="v5-calendar-script">
(function(){
const showFields=[['title','Nome do show'],['date','Data','date'],['city','Cidade'],['venue','Local / casa de show'],['address','Endereço completo'],['soundcheck','Horário da passagem de som','time'],['start','Início do show','time'],['arrival','Chegada da equipe','time'],['contact','Contato do contratante'],['notes','Observações','textarea']];
sections.shows.fields=showFields;
let month=new Date();month.setDate(1);let chosen=new Date().toLocaleDateString('en-CA');
const oldRender=render;const oldOpen=openForm;
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
chosen=iso(new Date());
function renderCalendar(){
const yr=month.getFullYear(),mo=month.getMonth(),start=(new Date(yr,mo,1).getDay()+6)%7,days=new Date(yr,mo+1,0).getDate();
const header=`<div class="calendar-head"><button id="prevMonth" aria-label="Mês anterior">‹</button><h3>${esc(month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</h3><button id="nextMonth" aria-label="Próximo mês">›</button></div>`;
let cells='';for(let i=0;i<start;i++)cells+='<div class="calendar-day empty"></div>';
for(let day=1;day<=days;day++){const d=iso(new Date(yr,mo,day));const has=db.shows.some(x=>x.date===d);cells+=`<button class="calendar-day ${d===chosen?'selected':''} ${d===iso(new Date())?'today':''} ${has?'has-show':''}" data-day="${d}" aria-label="Selecionar ${day}">${day}</button>`}
const entries=db.shows.map((x,i)=>({...x,_index:i})).filter(x=>x.date===chosen);
const dateLabel=new Date(chosen+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
const showCards=entries.map(x=>`<div class="show-card"><strong>${esc(x.title||'Show sem nome')}</strong>${[['city','Cidade'],['venue','Local'],['address','Endereço'],['soundcheck','Passagem de som'],['start','Início do show'],['arrival','Chegada da equipe'],['contact','Contato'],['notes','Observações']].filter(([k])=>x[k]).map(([k,l])=>`<p><b>${l}:</b> ${esc(x[k])}</p>`).join('')}${(x.extras||[]).map(e=>`<p><b>${esc(e.name)}:</b> ${esc(e.value)}</p>`).join('')}<div class="show-actions">${allowed('shows','edit')?`<button data-cal-edit="${x._index}">Editar / acrescentar</button>`:''}${allowed('shows','delete')?`<button class="danger" data-cal-delete="${x._index}">Excluir</button>`:''}</div></div>`).join('');
$('content').innerHTML=`<div class="calendar-shell">${header}<p class="calendar-instruction">Toque em uma data para visualizar ou cadastrar as informações do show.</p><div class="calendar-week">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-days">${cells}</div><div class="day-detail"><h3>${esc(dateLabel)}</h3>${showCards||'<p class="muted">Nenhum show cadastrado nesta data.</p>'}${allowed('shows','add')?'<button class="primary show-add" id="addForDay">+ Adicionar show nesta data</button>':''}</div></div>`;
$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderCalendar()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderCalendar()};
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{chosen=b.dataset.day;renderCalendar()});
const add=$('addForDay');if(add)add.onclick=()=>openForm();
document.querySelectorAll('[data-cal-edit]').forEach(b=>b.onclick=()=>openForm(Number(b.dataset.calEdit)));
document.querySelectorAll('[data-cal-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este show?')){db.shows.splice(Number(b.dataset.calDelete),1);persist();renderCalendar()}});
}
render=function(){oldRender();if(!home&&current==='shows'&&allowed('shows','view'))renderCalendar()};
openForm=function(index=null){oldOpen(index);if(current!=='shows'||!allowed('shows',index===null?'add':'edit'))return;
const data=index===null?{}:db.shows[index];const dateField=$('field_date');if(index===null&&dateField)dateField.value=chosen;
const extraBox=document.createElement('div');extraBox.innerHTML='<label>Informações adicionais personalizadas</label><p class="field-note">Acrescente quantos campos quiser: camarim, alimentação, estacionamento, responsável, etc.</p><div id="extraRows"></div><button type="button" id="addExtra">+ Adicionar outro campo</button>';$('fields').appendChild(extraBox);
const rows=$('extraRows');function row(name='',value=''){const el=document.createElement('div');el.className='extra-row';el.innerHTML='<input aria-label="Nome do campo" placeholder="Nome (ex.: Camarim)"><input aria-label="Informação" placeholder="Informação"><button type="button" aria-label="Remover campo">✕</button>';el.children[0].value=name;el.children[1].value=value;el.children[2].onclick=()=>el.remove();rows.appendChild(el)}
(data.extras||[]).forEach(x=>row(x.name,x.value));$('addExtra').onclick=()=>row();
};
const originalSubmit=$('form').onsubmit;
$('form').onsubmit=function(e){if(current!=='shows'){originalSubmit(e);return}e.preventDefault();if(!allowed('shows',editing===null?'add':'edit'))return;const data=Object.fromEntries(new FormData(e.target).entries());data.extras=Array.from(document.querySelectorAll('#extraRows .extra-row')).map(r=>({name:r.children[0].value.trim(),value:r.children[1].value.trim()})).filter(x=>x.name);if(!data.title.trim()||!data.date){alert('Preencha o nome e a data do show.');return}if(editing===null)db.shows.push(data);else db.shows[editing]=data;chosen=data.date;month=new Date(chosen+'T12:00:00');month.setDate(1);persist();$('modal').close();render()};
render();
})();
</script>
<style>
/* Faz o fundo preto da arte desaparecer visualmente sobre o fundo escuro. */
.brand,.hero img{mix-blend-mode:screen}
.file-panel{padding:16px;border:1px solid #bd8aa5;border-radius:18px;background:#211520;margin:15px 0}
.file-panel input,.file-panel select{width:100%;margin:7px 0 13px;padding:11px;border-radius:10px}
.file-row{padding:12px;border-bottom:1px solid #64455a;overflow-wrap:anywhere}
.file-row button{margin:5px}
</style>
<script>
/* Arquivos de demonstração armazenados apenas no navegador deste aparelho. */
(function(){
const openDb=()=>new Promise((resolve,reject)=>{let q=indexedDB.open('bia_arquivos_local_v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
async function tx(mode,fn){const db=await openDb();return new Promise((resolve,reject)=>{const t=db.transaction('files',mode),st=t.objectStore('files');fn(st,resolve,reject);t.onerror=()=>reject(t.error);t.oncomplete=()=>db.close()})}
const all=()=>tx('readonly',(st,ok,fail)=>{const r=st.getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)});
const put=v=>tx('readwrite',(st,ok)=>{st.put(v);ok()});
const del=id=>tx('readwrite',(st,ok)=>{st.delete(id);ok()});
function escapeText(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]))}
async function draw(){
 const content=document.getElementById('content');if(!content||window.home||window.current==='access')return;
 // A navegação Arquivos é vinculada à seção de documentos.
 if(!document.querySelector('[data-tab="docs"].active') && !document.querySelector('#heading')?.textContent.includes('Documentos'))return;
 const panel=document.createElement('section');panel.className='file-panel';panel.id='phoneFiles';
 panel.innerHTML='<h3>📎 Arquivos do celular</h3><p>Escolha um arquivo no iPhone e organize por show ou na pasta geral.</p><p class="muted"><b>Versão de teste:</b> arquivos ficam somente neste navegador, não são enviados à equipe. Não coloque contratos ou dados sensíveis.</p><label for="folderName">Pasta / show</label><input id="folderName" placeholder="Geral ou nome do show" value="Geral"><label for="filePick">Selecionar arquivo</label><input id="filePick" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.png,.jpg,.jpeg,.webp,.zip"><button class="primary" id="saveFiles" type="button">Salvar arquivos neste aparelho</button><div id="uploadedFiles"></div>';
 content.prepend(panel);
 async function list(){let items=await all();const target=document.getElementById('uploadedFiles');if(!target)return;target.innerHTML='<h3>Arquivos salvos ('+items.length+')</h3>'+(items.length?'':'<p class="muted">Nenhum arquivo enviado ainda.</p>');items.sort((a,b)=>b.created-a.created).forEach(f=>{const row=document.createElement('div');row.className='file-row';row.innerHTML='<b>'+escapeText(f.name)+'</b><p class="muted">📁 '+escapeText(f.folder)+' · '+(f.blob.size/1024/1024).toFixed(2)+' MB</p><button type="button" class="open">Abrir / baixar</button><button type="button" class="remove">Excluir</button>';row.querySelector('.open').onclick=()=>{const url=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};row.querySelector('.remove').onclick=async()=>{if(confirm('Excluir este arquivo deste aparelho?')){await del(f.id);list()}};target.appendChild(row)})}
 panel.querySelector('#saveFiles').onclick=async()=>{const input=panel.querySelector('#filePick'),folder=panel.querySelector('#folderName').value.trim()||'Geral';if(!input.files.length){alert('Escolha um arquivo primeiro.');return}try{for(const file of input.files){if(file.size>15*1024*1024){alert('Arquivo acima de 15 MB: '+file.name);continue}await put({id:crypto.randomUUID(),name:file.name,folder,blob:file,created:Date.now()})}input.value='';await list();alert('Arquivo salvo somente neste aparelho.')}catch(e){alert('Não foi possível salvar. Verifique o espaço disponível no navegador.')}};
 await list();
}
const observer=new MutationObserver(()=>{if(document.querySelector('#heading')?.textContent.includes('Documentos')&&!document.querySelector('#phoneFiles'))draw().catch(console.error)});
window.addEventListener('DOMContentLoaded',()=>{observer.observe(document.getElementById('workspace'),{subtree:true,childList:true});draw().catch(console.error)});
})();
</script>
